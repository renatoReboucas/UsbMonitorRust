<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link rel="stylesheet" href="./compact.css">
    <script src="./runtime.js" defer></script>
    <title>Layout compacto</title>
  </head>
  <body>
    <main class="display">
      <header class="top"><div><b id="computer">Este computador</b><small id="os">Windows</small></div><time id="clock">--:--</time><span id="date"></span></header>
      <section class="cards">
        <article class="cpu"><label>CPU · <span id="cpu-frequency">— GHz</span></label><strong id="cpu-usage">N/D</strong><i><b id="cpu-meter"></b></i><small id="cpu-name"></small></article>
        <article class="ram"><label>MEMÓRIA · <span id="ram-total">N/D</span></label><strong id="ram-usage">N/D</strong><i><b id="ram-meter"></b></i><small id="ram-name"></small></article>
        <article class="gpu"><label>GPU · <span id="gpu-temperature">TEMP N/D</span></label><strong id="gpu-usage">N/D</strong><i><b id="gpu-meter"></b></i><small id="gpu-name"></small></article>
      </section>
      <footer><span id="weather-icon">☁</span><b id="weather-temperature">—°C</b><span id="weather-description">CLIMA</span><span id="weather-city">São Paulo</span><span id="weather-high">↑ —°</span><span id="weather-low">↓ —°</span><span id="weather-humidity">◉ —%</span><span id="uptime">—</span><span id="upload">↑ —</span><span id="download">↓ —</span><span id="network">—</span><span id="vram">VRAM —</span></footer>
    </main>
  </body>
</html>
