<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#0c0f17">
    <link rel="stylesheet" href="./display-base.css">
    <link rel="stylesheet" href="./compact.css">
    <script src="./runtime.js" defer></script>
    <title>Layout Compacto · 3.5"</title>
  </head>
  <body>
    <main class="display">
      <!-- Relógio e clima -->
      <header class="display-header">
        <div class="clock-group">
          <time id="clock" class="clock">--:--</time>
          <span id="date" class="clock-date">-- --- ----</span>
        </div>

        <div class="weather">
          <span id="weather-icon" class="weather-icon" aria-hidden="true">☁</span>
          <b id="weather-temperature" class="weather-temp">—°C</b>
          <span class="weather-sep" aria-hidden="true">·</span>
          <span id="weather-city" class="weather-city">São Paulo</span>
        </div>
      </header>

      <!-- Três pilares verticais: CPU, RAM e GPU -->
      <section class="metrics" aria-label="Uso de CPU, memória e GPU">
        <article class="metric metric-cpu">
          <div class="metric-head">
            <span class="metric-label">CPU</span>
            <span id="cpu-frequency" class="metric-spec">— GHz</span>
          </div>
          <div class="metric-main">
            <strong id="cpu-usage" class="metric-value">N/D</strong>
            <div class="meter"><i id="cpu-meter" class="meter-fill"></i></div>
          </div>
          <small id="cpu-name" class="metric-name">Processador</small>
        </article>

        <article class="metric metric-ram">
          <div class="metric-head">
            <span class="metric-label">RAM</span>
            <span id="ram-total" class="metric-spec">N/D</span>
          </div>
          <div class="metric-main">
            <strong id="ram-usage" class="metric-value">N/D</strong>
            <div class="meter"><i id="ram-meter" class="meter-fill"></i></div>
          </div>
          <small id="ram-name" class="metric-name">Memória do sistema</small>
        </article>

        <article class="metric metric-gpu">
          <div class="metric-head">
            <span class="metric-label">GPU</span>
            <span id="gpu-temperature" class="metric-spec">N/D</span>
          </div>
          <div class="metric-main">
            <strong id="gpu-usage" class="metric-value">N/D</strong>
            <div class="meter"><i id="gpu-meter" class="meter-fill"></i></div>
          </div>
          <small id="gpu-name" class="metric-name">GPU indisponível</small>
        </article>
      </section>

      <!-- Rodapé: uptime, rede, temperatura da CPU e VRAM -->
      <footer class="footer" aria-label="Resumo do sistema">
        <div class="footer-item">
          <span class="footer-label">UPTIME</span>
          <b id="uptime" class="footer-value">—</b>
        </div>
        <div class="footer-item">
          <div class="footer-net">
            <span id="upload" class="net-upload">↑ —</span>
            <span id="download" class="net-down">↓ —</span>
          </div>
        </div>
        <div class="footer-item">
          <b id="cpu-temperature" class="footer-value footer-temperature">CPU: —°C</b>
        </div>
        <div class="footer-item">
          <span class="footer-label">VRAM</span>
          <b id="vram" class="footer-value">—</b>
        </div>
      </footer>
    </main>
  </body>
</html>
