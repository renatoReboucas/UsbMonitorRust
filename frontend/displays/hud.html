<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="./hud.css">
    <script src="./runtime.js" defer></script>
    <title>HUD · Cyberpunk OLED · 3.5"</title>
  </head>
  <body>
    <main class="display">
      <!-- HEADER HUD -->
      <header class="hud-header">
        <div class="hud-brand">
          <span class="hud-marker">◤</span>
          <div>
            <b id="computer">SYS-MONITOR</b>
            <small id="os">WINDOWS</small>
          </div>
        </div>

        <div class="hud-clock-wrap">
          <time id="clock">--:--</time>
          <span id="date" class="hud-date">-- --- ----</span>
        </div>

        <div class="hud-weather">
          <div class="weather-row">
            <span id="weather-icon">☁</span>
            <b id="weather-temperature">—°C</b>
          </div>
          <span id="weather-city" class="hud-city-txt">SÃO PAULO</span>
          <!-- Elementos preservados para runtime -->
          <small id="weather-description" style="display:none">CLIMA</small>
          <span id="weather-high" style="display:none">↑ —°</span>
          <span id="weather-low" style="display:none">↓ —°</span>
          <span id="weather-humidity" style="display:none">◉ —%</span>
        </div>
      </header>

      <!-- 3 MÓDULOS DE TELEMETRIA HUD -->
      <section class="hud-grid">
        <!-- CPU -->
        <article class="hud-card cpu">
          <div class="card-top">
            <span class="card-badge">CPU</span>
            <span id="cpu-frequency" class="card-spec">— GHz</span>
          </div>
          <div class="card-center">
            <strong id="cpu-usage">N/D</strong>
          </div>
          <div class="hud-gauge">
            <div class="hud-gauge-bar"><i id="cpu-meter"></i></div>
          </div>
          <small id="cpu-name" class="card-name">Processador</small>
        </article>

        <!-- RAM -->
        <article class="hud-card ram">
          <div class="card-top">
            <span class="card-badge">RAM</span>
            <span id="ram-total" class="card-spec">N/D</span>
          </div>
          <div class="card-center">
            <strong id="ram-usage">N/D</strong>
          </div>
          <div class="hud-gauge">
            <div class="hud-gauge-bar"><i id="ram-meter"></i></div>
          </div>
          <small id="ram-name" class="card-name">Memória do sistema</small>
        </article>

        <!-- GPU -->
        <article class="hud-card gpu">
          <div class="card-top">
            <span class="card-badge">GPU</span>
            <span id="gpu-temperature" class="card-spec">N/D</span>
          </div>
          <div class="card-center">
            <strong id="gpu-usage">N/D</strong>
          </div>
          <div class="hud-gauge">
            <div class="hud-gauge-bar"><i id="gpu-meter"></i></div>
          </div>
          <small id="gpu-name" class="card-name">GPU indisponível</small>
        </article>
      </section>

      <!-- BARRA DE STATUS INFERIOR -->
      <footer class="hud-footer">
        <div class="hud-stat">
          <span class="hud-lbl">UPTIME</span>
          <b id="uptime">—</b>
        </div>
        <div class="hud-stat net-stat">
          <span class="hud-lbl">NET</span>
          <div class="net-duo">
            <b id="upload">↑ —</b>
            <b id="download">↓ —</b>
          </div>
        </div>
        <div class="hud-stat">
          <span class="hud-lbl">LINK</span>
          <b id="network">ONLINE</b>
        </div>
        <div class="hud-stat">
          <span class="hud-lbl">VRAM</span>
          <b id="vram">—</b>
        </div>
      </footer>
    </main>
  </body>
</html>
