<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <link rel="stylesheet" href="./minimal.css">
    <script src="./runtime.js" defer></script>
    <title>Layout minimalista</title>
  </head>
  <body>
    <main class="display">
      <header><div><small id="os">WINDOWS</small><b id="computer">Este computador</b></div><time id="clock">--:--</time><span id="date"></span></header>
      <section class="reading"><article><label>PROCESSADOR <span id="cpu-frequency">— GHz</span></label><strong id="cpu-usage">N/D</strong><i><b id="cpu-meter"></b></i><small id="cpu-name">CPU</small></article><article><label>MEMÓRIA <span id="ram-total">N/D</span></label><strong id="ram-usage">N/D</strong><i><b id="ram-meter"></b></i><small id="ram-name">RAM</small></article><article><label>GRÁFICOS <span id="gpu-temperature">TEMP N/D</span></label><strong id="gpu-usage">N/D</strong><i><b id="gpu-meter"></b></i><small id="gpu-name">GPU</small></article></section>
      <footer><span><b id="weather-icon">☀</b> <b id="weather-temperature">—°C</b><small id="weather-description">CLIMA</small></span><span id="weather-city">São Paulo</span><span id="weather-high">↑ —°</span><span id="weather-low">↓ —°</span><span id="weather-humidity">◉ —%</span><span id="uptime">—</span><span id="upload">↑ —</span><span id="download">↓ —</span><span id="network">—</span><span id="vram">VRAM —</span></footer>
    </main>
  </body>
</html>
