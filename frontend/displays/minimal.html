<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" href="./minimal.css">
    <script src="./runtime.js" defer></script>
    <title>Layout Minimalista · 3.5"</title>
  </head>
  <body>
    <main class="display">
      <!-- CABEÇALHO MINIMALISTA -->
      <header class="minimal-header">
        <div class="time-block">
          <time id="clock">--:--</time>
          <span id="date" class="date-chip">-- --- ----</span>
        </div>

        <div class="weather-chip">
          <span id="weather-icon">☀</span>
          <b id="weather-temperature">—°C</b>
          <span class="sep">·</span>
          <span id="weather-city" class="weather-city-name">São Paulo</span>
        </div>

        <!-- IDs preservados para compatibilidade com runtime -->
        <span id="computer" style="display:none">Este computador</span>
        <small id="os" style="display:none">Windows</small>
        <span id="weather-description" style="display:none">CLIMA</span>
        <span id="weather-high" style="display:none">↑ —°</span>
        <span id="weather-low" style="display:none">↓ —°</span>
        <span id="weather-humidity" style="display:none">◉ —%</span>
      </header>

      <!-- 3 CARTÕES DE LEITURA (CPU, RAM, GPU) -->
      <section class="reading">
        <!-- CPU -->
        <article class="card cpu">
          <div class="card-head">
            <span class="card-tag">CPU</span>
            <span id="cpu-frequency" class="card-spec">— GHz</span>
          </div>
          <div class="card-val-row">
            <strong id="cpu-usage">N/D</strong>
          </div>
          <div class="meter-bar">
            <i id="cpu-meter"></i>
          </div>
          <small id="cpu-name" class="card-foot">Processador</small>
        </article>

        <!-- RAM -->
        <article class="card ram">
          <div class="card-head">
            <span class="card-tag">RAM</span>
            <span id="ram-total" class="card-spec">N/D</span>
          </div>
          <div class="card-val-row">
            <strong id="ram-usage">N/D</strong>
          </div>
          <div class="meter-bar">
            <i id="ram-meter"></i>
          </div>
          <small id="ram-name" class="card-foot">Memória do sistema</small>
        </article>

        <!-- GPU -->
        <article class="card gpu">
          <div class="card-head">
            <span class="card-tag">GPU</span>
            <span id="gpu-temperature" class="card-spec">N/D</span>
          </div>
          <div class="card-val-row">
            <strong id="gpu-usage">N/D</strong>
          </div>
          <div class="meter-bar">
            <i id="gpu-meter"></i>
          </div>
          <small id="gpu-name" class="card-foot">GPU indisponível</small>
        </article>
      </section>

      <!-- RODAPÉ LIMPO -->
      <footer class="minimal-footer">
        <div class="foot-cell">
          <span class="foot-title">UPTIME</span>
          <b id="uptime">—</b>
        </div>
        <div class="foot-cell net-cell">
          <span class="foot-title">REDE</span>
          <div class="net-speeds">
            <span id="upload">↑ —</span>
            <span id="download">↓ —</span>
          </div>
        </div>
        <div class="foot-cell">
          <span class="foot-title">VRAM</span>
          <b id="vram">—</b>
        </div>
        <span id="network" style="display:none">—</span>
      </footer>
    </main>
  </body>
</html>
