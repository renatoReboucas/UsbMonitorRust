<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <title>UsbMonitor · console</title>
    <link rel="stylesheet" href="./display-base.css" />
    <link rel="stylesheet" href="./console.css" />
    <script src="./runtime.js" defer></script>
  </head>
  <body>
    <main class="display">
      <header class="console-header">
        <div class="console-brand">
          <span class="brand-mark" aria-hidden="true">&gt;_</span>
          <div class="brand-text">
            <b id="computer">Este computador</b>
            <small id="os">Windows</small>
          </div>
        </div>
        <div class="console-net">
          <div class="net-group">
            <span class="net-arrow net-upload" aria-hidden="true">↑</span>
            <b id="upload" class="net-value net-upload">—</b>
            <small class="net-unit">/s</small>
          </div>
          <div class="net-group">
            <span class="net-arrow net-down" aria-hidden="true">↓</span>
            <b id="download" class="net-value net-down">—</b>
            <small class="net-unit">/s</small>
          </div>
        </div>
      </header>

      <section class="side">
        <section class="hero" aria-label="Relógio e clima">
          <time id="clock" class="hero-clock">--:--</time>
          <div class="hero-meta">
            <span id="date" class="hero-date">-- --- ----</span>
          </div>
          <div class="hero-weather">
            <span id="weather-icon" class="weather-icon" aria-hidden="true">☁</span>
            <b id="weather-temperature" class="weather-temp">—°C</b>
            <span id="weather-city" class="weather-city">São Paulo</span>
          </div>
        </section>

        <section class="status" aria-label="Temperatura, memória de vídeo e clima">
          <div class="status-card status-temp">
            <span class="status-label">TEMP</span>
            <b id="cpu-temp" class="status-value">—°C</b>
          </div>
          <div class="status-card status-vram">
            <span class="status-label">VRAM</span>
            <b id="vram" class="status-value">—</b>
          </div>
          <div class="status-card status-humid">
            <span class="status-label">UMIDADE</span>
            <b id="weather-humidity-value" class="status-value">—%</b>
          </div>
          <div class="status-card status-clima">
            <span class="status-label">CLIMA</span>
            <b class="status-value"><span id="weather-high">↑ —°</span> <span id="weather-low">↓ —°</span></b>
          </div>
        </section>
      </section>

      <section class="cards" aria-label="Carga de CPU, memória e GPU">
        <article class="card card-cpu">
          <div class="card-head">
            <span class="card-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="7" y="7" width="10" height="10" rx="1.5" /><path d="M10 3v4M14 3v4M10 17v4M14 17v4M3 10h4M3 14h4M17 10h4M17 14h4" /></svg></span>
            <span class="card-label">CPU</span>
            <b id="cpu-usage" class="card-value">—</b>
          </div>
          <div class="meter"><span id="cpu-meter" class="meter-fill"></span></div>
          <div class="card-foot">
            <small id="cpu-frequency" class="card-spec">—</small>
            <span id="cpu-name" class="card-name">Processador</span>
          </div>
        </article>

        <article class="card card-ram">
          <div class="card-head">
            <span class="card-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="8" rx="1.5" /><path d="M7 16v3M12 16v3M17 16v3M7 11h2M12 11h2" /></svg></span>
            <span class="card-label">RAM</span>
            <b id="ram-usage" class="card-value">—</b>
          </div>
          <div class="meter"><span id="ram-meter" class="meter-fill"></span></div>
          <div class="card-foot">
            <small id="ram-total" class="card-spec">—</small>
            <span id="ram-name" class="card-name">Memória do sistema</span>
          </div>
        </article>

        <article class="card card-gpu">
          <div class="card-head">
            <span class="card-icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="7" width="18" height="11" rx="2" /><circle cx="12" cy="12.5" r="2.6" /><path d="M7 18v2M17 18v2" /></svg></span>
            <span class="card-label">GPU</span>
            <b id="gpu-usage" class="card-value">—</b>
          </div>
          <div class="meter"><span id="gpu-meter" class="meter-fill"></span></div>
          <div class="card-foot">
            <small id="gpu-temperature" class="card-spec">—</small>
            <span id="gpu-name" class="card-name">GPU indisponível</span>
          </div>
        </article>
      </section>
    </main>
  </body>
</html>
