<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=480, height=320, initial-scale=1">
    <link rel="stylesheet" href="./reference.css">
    <script src="./runtime.js" defer></script>
    <title>Layout de Referência · 3.5"</title>
  </head>
  <body>
    <main class="display">
      <!-- PAINEL ESQUERDO: Relógio, Sistema e Clima -->
      <section class="overview">
        <header class="sys-chip">
          <span class="sys-icon">▣</span>
          <div class="sys-meta">
            <b id="computer">Este computador</b>
            <small id="os">Windows</small>
          </div>
        </header>

        <div class="clock-box">
          <time id="clock">--:--</time>
          <div id="date" class="date-badge">-- --- ----</div>
        </div>

        <section class="weather-box">
          <div class="weather-primary">
            <span id="weather-icon" class="weather-icon">☁</span>
            <b id="weather-temperature">—°C</b>
          </div>
          <div class="weather-secondary">
            <span id="weather-city">São Paulo</span>
            <div class="weather-sub">
              <span id="weather-humidity">◉ —%</span>
              <small id="weather-description">CLIMA</small>
            </div>
            <!-- Elementos preservados para compatibilidade com runtime -->
            <span id="weather-high" style="display:none">↑ —°</span>
            <span id="weather-low" style="display:none">↓ —°</span>
          </div>
        </section>
      </section>

      <!-- PAINEL DIREITO: 3 Cartões de Telemetria (CPU, RAM, GPU) -->
      <section class="metrics">
        <!-- CPU -->
        <article class="metric cpu">
          <div class="metric-head">
            <span class="metric-tag">CPU</span>
            <span id="cpu-frequency" class="metric-spec">— GHz</span>
          </div>
          <div class="metric-core">
            <strong id="cpu-usage" class="metric-val">N/D</strong>
            <div class="meter-track"><i id="cpu-meter"></i></div>
          </div>
          <small id="cpu-name" class="metric-foot">Processador</small>
        </article>

        <!-- RAM -->
        <article class="metric ram">
          <div class="metric-head">
            <span class="metric-tag">RAM</span>
            <span id="ram-total" class="metric-spec">N/D</span>
          </div>
          <div class="metric-core">
            <strong id="ram-usage" class="metric-val">N/D</strong>
            <div class="meter-track"><i id="ram-meter"></i></div>
          </div>
          <small id="ram-name" class="metric-foot">Memória do sistema</small>
        </article>

        <!-- GPU -->
        <article class="metric gpu">
          <div class="metric-head">
            <span class="metric-tag">GPU</span>
            <span id="gpu-temperature" class="metric-spec">TEMP N/D</span>
          </div>
          <div class="metric-core">
            <strong id="gpu-usage" class="metric-val">N/D</strong>
            <div class="meter-track"><i id="gpu-meter"></i></div>
          </div>
          <small id="gpu-name" class="metric-foot">GPU indisponível</small>
        </article>
      </section>

      <!-- BARRA INFERIOR: Uptime, Rede, Status e VRAM -->
      <footer class="footer-bar">
        <div class="foot-col">
          <span class="foot-lbl">UPTIME</span>
          <b id="uptime" class="foot-val">—</b>
        </div>
        <div class="foot-col net-col">
          <span class="foot-lbl">REDE</span>
          <div class="net-row">
            <b id="upload">↑ —</b>
            <b id="download">↓ —</b>
          </div>
        </div>
        <div class="foot-col">
          <span class="foot-lbl">STATUS</span>
          <b id="network" class="foot-val">—</b>
        </div>
        <div class="foot-col">
          <span class="foot-lbl">VRAM</span>
          <b id="vram" class="foot-val">—</b>
        </div>
      </footer>
    </main>
  </body>
</html>
